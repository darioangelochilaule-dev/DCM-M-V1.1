<!doctype html><html lang="pt"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DCM-M V1.1</title><body style="font-family:Arial;max-width:800px;margin:auto;padding:20px"><h1>DCM-M</h1><b>SANDBOX V1.1 — 1 DCM = 1 MZN</b><section id="login"><p>Administrador</p><input id="e" value="admin@dcm.local"><input id="pw" type="password" value="ChangeMe123!"><button onclick="login()">Entrar</button><pre id="m"></pre></section><section id="app" hidden><button onclick="load()">Actualizar</button><h2>Saldo</h2><pre id="b"></pre><h2>Reconciliação</h2><pre id="r"></pre><p>Ambiente exclusivamente de teste.</p></section><script>let t='';async function api(u,o={}){o.headers={'Content-Type':'application/json',Authorization:'Bearer '+t};let x=await fetch(u,o),d=await x.json();if(!x.ok)throw Error(d.error);return d}async function login(){try{let d=await api('/api/v1/auth/login',{method:'POST',body:JSON.stringify({email:e.value,password:pw.value})});t=d.token;login.style.display='none';app.hidden=false;load()}catch(x){m.textContent=x.message}}async function load(){b.textContent=JSON.stringify(await api('/api/v1/wallet/me'),null,2);r.textContent=JSON.stringify(await api('/api/v1/reconciliation'),null,2)}</script></body></html>
