services:
  - type: web
    name: dcm-m-v11
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: dcm-m-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
databases:
  - name: dcm-m-postgres
    plan: free
